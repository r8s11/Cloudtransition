<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workspace map</title>
    <!--
      Visual Second Brain: the entire app. Its only runtime input is
      workspace-index.json beside it (rebuild with refresh-index.py).
      Libraries are pinned locally; no remote runtime service is required.
      When the dashboard serves it, the index response carries an
      X-Workspace-Open header naming the safe file route; standalone it shows
      paths and copy only.
    -->
    <style>
      /* ── Orizuru tokens (mirrors dashboard-app/static/style.css) ── */
      @font-face {
        font-family: "Inter";
        src: local("Inter"), local("Inter Variable"), url("/static/fonts/InterVariable.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Inter";
        src: local("Inter Italic"), local("Inter Variable Italic"), url("/static/fonts/InterVariable-Italic.woff2") format("woff2");
        font-weight: 100 900;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: local("JetBrains Mono"), url("/static/fonts/JetBrainsMono.woff2") format("woff2");
        font-weight: 100 800;
        font-display: swap;
      }
      :root {
        --vermilion: #b3212e;
        --vermilion-deep: #8e1a24;
        --fold-white: #f4ead8;
        --paper: #f8f1e3;
        --paper-deep: #efe3cd;
        --paper-hi: #fdf9ef;
        --gold: #c9a227;
        --gold-tint: rgba(201, 162, 39, 0.3);
        --sumi: #171512;
        --ink: #211d18;
        --ink-mid: #4f483c;
        --ink-muted: #554d41;
        --border: #d8c9ab;
        --border-light: #e4dac4;
        --green: #3f7d54;
        --warn: #8a5a00;
        --radius: 10px;
        --radius-sm: 6px;
        --shadow: 0 2px 10px rgba(90, 62, 31, 0.14);
        --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        --tile-min: 216px;
        --tile-name: 16px;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        --motion-fast: 120ms;
        --motion-panel: 220ms;
      }
      /* Inside the Command Center tab the map takes the dashboard's navy
         panels and single orange signal (dashboard-app/static/tokens.css).
         Standalone, it keeps the washi sheet above. */
      :root.embedded {
        color-scheme: dark;
        --vermilion: #ff7a1a;
        --vermilion-deep: #c95a0a;
        --fold-white: #1c0e02;
        --paper: #0e1d33;
        --paper-deep: #0a1628;
        --paper-hi: #14294a;
        --gold: #ffc247;
        --gold-tint: rgba(255, 194, 71, 0.3);
        --sumi: #f5f9ff;
        --ink: #dbe6f5;
        --ink-mid: #b4c5dc;
        --ink-muted: #9db1cc;
        --border: #223b60;
        --border-light: #182d4c;
        --green: #5fcf8a;
        --warn: #f2c14e;
        --shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
      }
      .embedded .top { background: var(--paper-deep); color: var(--ink); border-bottom: 1px solid var(--border); }
      .embedded .brand p { color: var(--ink-mid); }
      .embedded .brand p.stale { color: var(--warn); }
      .embedded #q { border-color: var(--border); }
      .embedded .seg button[aria-pressed="true"] { background: var(--vermilion); color: var(--fold-white); }
      .embedded .seg button:disabled { color: #5d7598; }
      .embedded .btn.done { color: var(--fold-white); }
      .embedded .graph:not(.graph-dark) {
        --graph-c1: #6aa9ff; --graph-c2: #4fd1c5; --graph-c3: #aa9cff;
        --graph-c4: #f2c14e; --graph-c5: #86d6a2; --graph-c6: #ff7b72;
      }
      :root[data-density="0"] {
        --tile-min: 168px;
        --tile-name: 14px;
      }
      :root[data-density="2"] {
        --tile-min: 288px;
        --tile-name: 19px;
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.5;
        color: var(--ink);
        background: var(--paper);
        caret-color: var(--vermilion);
        display: flex;
        flex-direction: column;
        height: 100dvh;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      ::selection {
        background: var(--gold-tint);
        color: var(--sumi);
      }
      * {
        scrollbar-color: var(--border) transparent;
      }
      :focus-visible {
        outline: 2px solid var(--vermilion);
        outline-offset: 2px;
        border-radius: 4px;
      }
      button,
      select,
      input,
      a {
        font: inherit;
        color: inherit;
      }
      .num {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      /* ── Masthead: the vermilion sheet ─────────────────────── */
      .top {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 8px 16px;
        background: var(--vermilion);
        color: var(--fold-white);
        flex-shrink: 0;
      }
      .brand {
        display: flex;
        flex-direction: column;
        min-width: 0;
        flex-shrink: 0;
      }
      .brand h1 {
        font-size: 16px;
        font-weight: 650;
        letter-spacing: -0.01em;
        line-height: 1.2;
      }
      .brand p {
        font-size: 12px;
        color: rgba(244, 234, 216, 0.9);
      }
      .brand p.stale {
        color: #fff3c4;
      }
      /* Inside the dashboard tab the page header already names the map. */
      .embedded .brand h1 {
        display: none;
      }
      .searchwrap {
        position: relative;
        flex: 1;
        max-width: 640px;
      }
      #q {
        width: 100%;
        height: 44px;
        padding: 0 48px 0 14px;
        font-size: 15px;
        color: var(--ink);
        background: var(--paper-hi);
        border: 1px solid var(--vermilion-deep);
        border-radius: var(--radius);
      }
      #q::placeholder {
        color: var(--ink-muted);
      }
      #q:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 1px;
      }
      #q::-webkit-search-cancel-button {
        display: none;
      }
      #clear {
        position: absolute;
        right: 0;
        top: 0;
        width: 44px;
        height: 44px;
        border: 0;
        background: none;
        cursor: pointer;
        color: var(--ink-mid);
        display: grid;
        place-items: center;
      }
      #clear[hidden] {
        display: none;
      }
      #clear svg {
        width: 16px;
        height: 16px;
      }
      .count {
        margin-left: auto;
        font-size: 12px;
        white-space: nowrap;
        flex-shrink: 0;
      }

      /* ── Toolbar ───────────────────────────────────────────── */
      .tools {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 16px;
        padding: 8px 16px;
        background: var(--paper-deep);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        overflow: hidden;
        background: var(--paper-hi);
      }
      .seg button {
        min-height: 44px;
        min-width: 44px;
        padding: 0 14px;
        border: 0;
        background: none;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        color: var(--ink-mid);
      }
      .seg button + button,
      .seg span + button {
        border-left: 1px solid var(--border);
      }
      .seg button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--paper-hi);
      }
      .seg button:disabled {
        color: var(--border);
        cursor: default;
      }
      .seg span {
        display: grid;
        place-items: center;
        min-width: 84px;
        padding: 0 8px;
        border-left: 1px solid var(--border);
        font-size: 12px;
        color: var(--ink-mid);
      }
      .field {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--ink-muted);
      }
      .field select {
        min-height: 44px;
        max-width: 220px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--paper-hi);
        color: var(--ink);
        font-size: 13px;
        cursor: pointer;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 44px;
        padding: 0 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--paper-hi);
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        text-decoration: none;
        transition: background-color 0.15s var(--ease);
      }
      .btn:active {
        background: var(--paper-deep);
      }
      .btn.primary {
        background: var(--vermilion);
        border-color: var(--vermilion-deep);
        color: var(--fold-white);
      }
      .btn.primary:active {
        background: var(--vermilion-deep);
      }
      .btn.done {
        background: var(--green);
        border-color: var(--green);
        color: #fff;
      }
      #filtersToggle {
        display: none;
      }

      /* ── Context bar: breadcrumbs + active filters ─────────── */
      .ctx {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 8px;
        padding: 12px 16px 0;
      }
      .ctx h2 {
        font-size: 18px;
        font-weight: 650;
        letter-spacing: -0.015em;
        margin-right: 8px;
        word-break: break-word;
      }
      .crumb {
        min-height: 44px;
        padding: 0 6px;
        border: 0;
        background: none;
        cursor: pointer;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--ink-mid);
        text-decoration: underline;
        text-underline-offset: 3px;
        text-decoration-color: var(--border);
      }
      .crumb-sep {
        color: var(--border);
        font-family: var(--mono);
      }
      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 4px 0 12px;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: var(--paper-hi);
        font-size: 12px;
        cursor: pointer;
      }
      .chip svg {
        width: 12px;
        height: 12px;
        margin: 0 10px 0 8px;
        color: var(--ink-muted);
      }

      /* ── Shell ─────────────────────────────────────────────── */
      .shell {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      .main {
        position: relative;
        flex: 1;
        min-width: 0;
        overflow-y: auto;
        padding: 12px 16px 48px;
      }

      /* A single optional sculpture; the file index keeps its own scroll geometry. */
      .atlas {
        display: flex;
        align-items: center;
        gap: 16px;
        min-height: 80px;
        margin: 0 0 12px;
        padding: 0 16px 12px;
        border-bottom: 1px solid var(--border-light);
      }
      .atlas[hidden] { display: none; }
      .atlas-stage {
        position: relative;
        flex-shrink: 0;
        width: 80px;
        height: 72px;
      }
      .atlas-stage svg,
      .atlas-stage canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .atlas-rendered .atlas-stage svg { visibility: hidden; }
      .atlas-name { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
      .atlas-caption { display: none; }
      .atlas-motion { margin-top: 14px; }
      #atlas[hidden] { display: none; }
      .atlas-motion[hidden] { display: none; }
      .atlas-list .atlas,
      .atlas-details .atlas { display: none; }
      @media (min-width: 1100px) {
        .main.atlas-space { padding-right: 344px; }
        .atlas {
          position: absolute;
          top: 32px;
          right: 24px;
          display: block;
          width: 288px;
          padding: 0;
          margin: 0;
          border: 0;
        }
        .atlas-stage { width: 288px; height: 292px; margin-bottom: 22px; }
        .atlas-caption { display: block; margin-top: 8px; font-size: 12px; color: var(--ink-mid); }
        .atlas-list .atlas { display: block; }
        .main.atlas-details { padding-right: 16px; }
        .atlas-details .atlas { display: none; }
      }
      .atlas-cover .ctx { display: block; padding: 96px 16px 28px; }
      .atlas-cover .ctx h2 { max-width: 13ch; font-size: clamp(38px, 5.6vw, 84px); line-height: 1.04; letter-spacing: -.03em; text-wrap: balance; }
      .fold-number { color: var(--vermilion); font-variant-numeric: tabular-nums; }
      .fold-word { display: inline-block; overflow: hidden; padding: .14em 0; margin: -.14em 0; vertical-align: bottom; }
      .fold-word > span, .fold-name { display: inline-block; }
      .fold-facts { margin-top: 18px; max-width: 60ch; color: var(--ink-mid); }
      .atlas-cover .atlas { position: absolute; top: 16px; left: 16px; margin: 0; padding: 0; border: 0; }
      .atlas-cover .atlas-name, .atlas-cover .atlas-caption { display: none; }
      #fold-ghosts { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
      .fold-card { position: absolute; border: 1px solid var(--border-light); border-radius: var(--radius); background: var(--paper-hi); }
      .fold-fly { position: absolute; font-weight: 650; line-height: 1.25; white-space: nowrap; transform-origin: 0 50%; }
      @media (min-width: 1100px) {
        .main.atlas-cover { padding-right: 16px; }
        .atlas-cover .ctx { min-height: 348px; padding: 0 476px 28px 16px; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; }
        .atlas-cover .atlas { top: 20px; right: 32px; left: auto; width: 420px; }
        .atlas-cover .atlas-stage { width: 420px; height: 340px; margin-bottom: 0; }
        .atlas-cover .atlas-motion { position: absolute; right: 0; bottom: 8px; margin: 0; }
      }

      /* Cluster tiles: one per topic or folder */
      .tiles {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(var(--tile-min), 100%), 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }
      .tile {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-height: 44px;
        padding: 14px;
        text-align: left;
        background: var(--paper-hi);
        border: 1px solid var(--border-light);
        border-radius: var(--radius);
        cursor: pointer;
        transition: background-color 0.15s var(--ease), border-color 0.15s var(--ease);
      }
      .tile:active {
        background: var(--paper-deep);
      }
      .tile-head {
        display: flex;
        align-items: baseline;
        gap: 12px;
      }
      .tile-name {
        flex: 1;
        min-width: 0;
        font-size: var(--tile-name);
        font-weight: 650;
        letter-spacing: -0.015em;
        line-height: 1.25;
        word-break: break-word;
      }
      .tile-n {
        font-size: 13px;
        color: var(--vermilion);
        font-weight: 600;
      }
      .tile-meta {
        font-size: 12px;
        color: var(--ink-muted);
        line-height: 1.45;
      }
      .tile-meta .num {
        font-size: 11px;
      }
      .tile-plain .tile-name {
        font-weight: 500;
        color: var(--ink-mid);
      }

      /* File rows (virtualized) */
      .listhead {
        font-size: 12px;
        color: var(--ink-muted);
        margin: 4px 0 8px;
      }
      .vp {
        position: relative;
      }
      .rows {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
      }
      .row {
        display: grid;
        grid-template-columns: 10px minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        width: 100%;
        height: 56px;
        padding: 0 12px;
        border: 0;
        border-bottom: 1px solid var(--border-light);
        background: none;
        text-align: left;
        cursor: pointer;
      }
      .row:active {
        background: var(--paper-deep);
      }
      .row[aria-current="true"] {
        background: var(--paper-deep);
      }
      .row .mark {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .row[aria-current="true"] .mark {
        background: var(--gold);
      }
      .row-mid {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .row-n,
      .row-p {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row-n {
        font-size: 14px;
        font-weight: 500;
      }
      .row-p {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink-muted);
      }
      .row-r {
        text-align: right;
        font-size: 11px;
        color: var(--ink-muted);
        line-height: 1.4;
      }
      mark {
        background: var(--gold-tint);
        color: inherit;
        border-radius: 2px;
      }
      .note {
        max-width: 62ch;
        margin: 32px auto;
        padding: 20px;
        background: var(--paper-hi);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        line-height: 1.6;
      }
      .note h2 {
        font-size: 17px;
        margin-bottom: 8px;
      }
      .note p + p,
      .note p + pre {
        margin-top: 10px;
      }
      pre,
      code {
        font-family: var(--mono);
        font-size: 12px;
      }
      pre {
        padding: 10px 12px;
        background: var(--paper-deep);
        border-radius: var(--radius-sm);
        white-space: pre-wrap;
        word-break: break-all;
      }

      /* ── Detail drawer ─────────────────────────────────────── */
      .det {
        width: 360px;
        flex-shrink: 0;
        overflow-y: auto;
        padding: 16px;
        background: var(--paper-hi);
        border-left: 1px solid var(--border);
      }
      .det[hidden] {
        display: none;
      }
      .det-top {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin-bottom: 4px;
      }
      .det h2 {
        flex: 1;
        font-size: 17px;
        font-weight: 650;
        letter-spacing: -0.015em;
        line-height: 1.3;
        word-break: break-word;
        padding-top: 10px;
      }
      .det h2:focus {
        outline: none;
      }
      .icon-btn {
        width: 44px;
        height: 44px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: var(--radius-sm);
        background: none;
        cursor: pointer;
        color: var(--ink-mid);
      }
      .icon-btn svg {
        width: 16px;
        height: 16px;
      }
      .det-sub {
        font-size: 12px;
        color: var(--ink-muted);
        margin-bottom: 16px;
      }
      .kv {
        display: grid;
        grid-template-columns: 76px 1fr;
        align-items: center;
        gap: 4px 12px;
        font-size: 13px;
        margin-bottom: 16px;
      }
      .kv dt {
        font-size: 12px;
        color: var(--ink-muted);
      }
      .kv dd {
        min-width: 0;
        word-break: break-word;
      }
      .link-btn {
        min-height: 44px;
        border: 0;
        background: none;
        cursor: pointer;
        text-align: left;
        text-decoration: underline;
        text-decoration-color: var(--border);
        text-underline-offset: 3px;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .tags .chip {
        padding: 0 12px;
      }
      .sect {
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-mid);
        margin: 16px 0 6px;
      }
      .pv {
        padding: 10px 12px;
        background: var(--paper);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-sm);
        font-size: 12.5px;
        line-height: 1.55;
        color: var(--ink-mid);
        max-height: 200px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .pv.none {
        font-style: italic;
      }
      .pth {
        padding: 8px 10px;
        background: var(--paper);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-sm);
        font-family: var(--mono);
        font-size: 11.5px;
        word-break: break-all;
        user-select: all;
      }
      .pth + .pth {
        margin-top: 6px;
      }
      .acts {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }
      .acts .btn {
        flex: 1 1 auto;
      }
      .status {
        min-height: 20px;
        margin-top: 8px;
        font-size: 12px;
        color: var(--ink-mid);
      }

      /* ── Footer: snapshot facts ────────────────────────────── */
      .foot {
        flex-shrink: 0;
        padding: 0 16px;
        border-top: 1px solid var(--border);
        background: var(--paper-deep);
        font-size: 12px;
        color: var(--ink-mid);
      }
      .foot summary {
        min-height: 44px;
        display: flex;
        align-items: center;
        cursor: pointer;
      }
      .foot .body {
        padding-bottom: 12px;
        max-height: 40vh;
        overflow: auto;
      }
      .foot ul {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
        margin: 4px 0 10px;
      }

      @media (hover: hover) {
        .tile:hover {

          if (previous) previous.destroy();
          graph.classList.remove("graph-3d");
          rendererState();
          showFocus();
          draw();
        }
        function stageVisible() {
          const rect = stage.getBoundingClientRect();
          return stage.isConnected && intersecting && !document.hidden && rect.width > 0 && rect.height > 0
            && rect.bottom > 0 && rect.top < innerHeight && rect.right > 0 && rect.left < innerWidth;
        }
        async function mountScene() {
          if (!alive || F.renderer !== "3d" || graph3DFailure || scene || sceneLoading || !width || !height || !stageVisible()) return;
          if (typeof WebGL2RenderingContext === "undefined") {
            failScene("WebGL2 is not available in this browser.");
            return;
          }
          sceneLoading = true;
          rendererState();
          try {
            const { createConstellation } = await import("./assets/constellation.js?v=observatory-5");
            if (!alive) return;
            if (!stageVisible()) {
              sceneLoading = false;
              rendererState();
              return;
            }
            const controller = await createConstellation(sceneHost, {
              layout, dark: graphDark, intro: allowSceneIntro && motionInput === "initial", fromPose: flyFrom,
              onPick: (target) => {
                if (!alive || !scene || failed) return;
                const entry = nodes.find((item) => target.type === "file" ? item.file && item.file.relativePath === target.path : !item.file && item.key === target.key);
                if (entry) activate(entry, true);
              },
              onZoom: (scale) => {
                if (!alive || failed) return;
                sceneZoom = scale;
                if (scene) showZoom(scale);
              },
              onFailure: failScene,
            });
            if (!alive || failed || F.renderer !== "3d") {
              controller.destroy();
              return;
            }
            scene = controller;
            sceneLoading = false;
            graph.classList.add("graph-3d");
            scene.theme(graphDark);
            scene.select(selectedPath);
            if (keyboardEntry) scene.focus(sceneTarget(keyboardEntry));
            rendererState();
            if (sceneZoom !== null) showZoom(sceneZoom); else zoomLabel.textContent = "—";
            showFocus();
          } catch (error) {
            failScene(error);
          }
        }
        svg.addEventListener("focusin", (e) => {
          const entry = nodes.find((item) => item.node === e.target);
          if (!entry) return;
          keyboardEntry = entry;
          focusedEntry = entry.file
            ? { type: "file", path: entry.file.relativePath }
            : { type: "group", key: entry.key };
          syncRelationships();
          for (const item of nodes) item.node.setAttribute("tabindex", item === entry ? "0" : "-1");
          if (scene) scene.focus(sceneTarget(entry));
          showFocus();
        }, opts);
        svg.addEventListener("focusout", (e) => {
          if (svg.contains(e.relatedTarget)) return;
          keyboardEntry = null;
          focusedEntry = null;
          syncRelationships();
          showFocus();
        }, opts);
        const relationshipEntry = (target) => {
          if (!(target instanceof Element)) return null;
          const node = target.closest(".graph-file, .graph-hub");
          if (!node || !svg.contains(node)) return null;
          return node.dataset.graphFile ? { type: "file", path: node.dataset.graphFile }
            : node.dataset.graphGroup ? { type: "group", key: node.dataset.graphGroup } : null;
        };
        const sameRelationship = (a, b) => a === b || Boolean(a && b && a.type === b.type
          && (a.type === "file" ? a.path === b.path : a.key === b.key));
        svg.addEventListener("pointerover", (e) => {
          if (e.pointerType === "touch") return;
          const next = relationshipEntry(e.target);
          if (sameRelationship(next, hoveredEntry)) return;
          hoveredEntry = next;
          syncRelationships();
        }, opts);
        svg.addEventListener("pointerout", (e) => {
          if (e.pointerType === "touch") return;
          const next = relationshipEntry(e.relatedTarget);
          if (sameRelationship(next, hoveredEntry)) return;
          hoveredEntry = next;
          syncRelationships();
        }, opts);
        svg.addEventListener("pointerleave", () => {
          if (!hoveredEntry) return;
          hoveredEntry = null;
          syncRelationships();
        }, opts);
        if ("IntersectionObserver" in window) {
          visibility = new IntersectionObserver((entries) => {
            intersecting = entries[0].isIntersecting;
            if (intersecting) mountScene();
          });
          visibility.observe(stage);
        } else {
          $("main").addEventListener("scroll", mountScene, { ...opts, passive: true });
        }
        document.addEventListener("visibilitychange", mountScene, opts);
        svg.addEventListener("keydown", (e) => {
          const current = nodes.findIndex((entry) => entry.node === e.target);
          if (current < 0) return;
          if (["ArrowRight", "ArrowDown", "ArrowLeft", "ArrowUp", "Home", "End"].includes(e.key)) {
            e.preventDefault();
            e.stopPropagation();
            const forward = e.key === "ArrowRight" || e.key === "ArrowDown";
            const index = e.key === "Home" ? 0 : e.key === "End" ? nodes.length - 1 : (current + (forward ? 1 : -1) + nodes.length) % nodes.length;
            focusNode(nodes[index]);
          } else if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            activate(nodes[current]);
          }
        }, opts);
        svg.addEventListener("wheel", (e) => {
          e.preventDefault();
          stopVisualMotion();
          const rect = svg.getBoundingClientRect();
          zoomAt(e.clientX - rect.left, e.clientY - rect.top, Math.exp(-Math.max(-150, Math.min(150, e.deltaY)) * .003));
        }, { ...opts, passive: false });
        const pointers = new Map();
        let moved = false;
        svg.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          const action = e.target.closest("[data-graph-action]");
          pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, startX: e.clientX, startY: e.clientY, action });
          if (pointers.size === 1) moved = false;
          else moved = true;
          svg.setPointerCapture(e.pointerId);
          svg.classList.add("panning");
        }, opts);
        svg.addEventListener("pointermove", (e) => {
          const old = pointers.get(e.pointerId);
          if (!old) return;
          const pair = [...pointers.values()];
          const oldDistance = pair.length === 2 ? Math.hypot(pair[0].x - pair[1].x, pair[0].y - pair[1].y) : 0;
          const oldMid = pair.length === 2 ? [(pair[0].x + pair[1].x) / 2, (pair[0].y + pair[1].y) / 2] : null;
          const dx = e.clientX - old.x, dy = e.clientY - old.y;
          if (Math.hypot(e.clientX - old.startX, e.clientY - old.startY) > 6) moved = true;
          old.x = e.clientX;
          old.y = e.clientY;
          if (pair.length === 2 && oldDistance > 0) {
            const rect = svg.getBoundingClientRect();
            zoomAt(oldMid[0] - rect.left, oldMid[1] - rect.top, Math.hypot(pair[0].x - pair[1].x, pair[0].y - pair[1].y) / oldDistance);
            camera.x += (pair[0].x + pair[1].x) / 2 - oldMid[0];
            camera.y += (pair[0].y + pair[1].y) / 2 - oldMid[1];
          } else {
            camera.x += dx;
            camera.y += dy;
          }
          draw();
        }, opts);
        function endPointer(e) {
          const point = pointers.get(e.pointerId);
          pointers.delete(e.pointerId);
          if (!pointers.size) svg.classList.remove("panning");
          if (e.type === "pointerup" && point && !moved && point.action) activate(nodes[Number(point.action.dataset.graphAction)], true);
        }
        svg.addEventListener("pointerup", endPointer, opts);
        svg.addEventListener("pointercancel", endPointer, opts);
        GRAPH = {
          select,
          pose: () => (scene ? scene.pose() : null),
          hubPoint: (key) => {
            if (scene) return scene.hubPoint(key);
            if (!alive || !width || !height || (F.renderer === "3d" && !failed)) return null;
            const node = nodes.find(item => !item.file && item.key === key)?.node;
            if (!node) return null;
            const rect = node.querySelector(".graph-hub-dot").getBoundingClientRect();
            return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2, color: getComputedStyle(node.querySelector(".graph-hub-dot")).fill };
          },
          focus: (path) => {
            const entry = nodes.find((item) => item.file && item.file.relativePath === path);
            if (entry) focusNode(entry); else $("q").focus();
          },
          destroy: () => {
            if (!alive) return;
            alive = false;
            events.abort();
            observe.disconnect();
            if (visibility) visibility.disconnect();
            if (scene) scene.destroy();
            scene = null;
            sceneHost.remove();
            graph.classList.remove("graph-3d");
            focusLabel.hidden = true;
          },
        };
        select(SEL ? SEL.relativePath : null);
        rendererState();
      }

      /* ── Detail drawer ───────────────────────────────────────── */
      let RETURN_TO = null;
      let RETURN_GRAPH = null;
      function openDetail(f, from, pointer = false) {
        stopOpening();
        const entrance = pointer && ($("det").hidden || detailClosing);
        SEL = f;
        RETURN_TO = from ? from.dataset.i : null;
        RETURN_GRAPH = from ? from.dataset.graphFile || null : null;
        paint();
        const d = $("det");
        d.inert = false;
        d.hidden = false;
        d.replaceChildren();
        const top = el("div", "det-top");
        const h = el("h2", "", f.name);
        h.tabIndex = -1;
        const close = el("button", "icon-btn");
        close.type = "button";
        close.setAttribute("aria-label", "Close details");
        close.appendChild(icon(X_ICON));
        close.addEventListener("click", (e) => closeDetail(true, e.detail > 0));
        top.append(h, close);
        d.append(top, el("p", "det-sub num", f.type + " · ." + f.extension + " · " + kb(f.size)));

        const dl = el("dl", "kv");
        const row = (k, node) => {
          const dd = el("dd");
          dd.appendChild(typeof node === "string" ? document.createTextNode(node) : node);
          dl.append(el("dt", "", k), dd);
        };
        const fb = el("button", "link-btn", f.folder || "workspace root");
        fb.type = "button";
        fb.addEventListener("click", () => setFolder(f.folder || ROOT));
        row("Folder", fb);
        row("Modified", fmtDate.format(f._ms));
        row("Project", f.project);
        d.appendChild(dl);

        if (f.topics.length) {
          d.appendChild(el("p", "sect", "Topics"));
          const tags = el("div", "tags");
          f.topics.forEach((t) => {
            const c = el("button", "chip", t);
            c.type = "button";
            c.setAttribute("aria-label", "Show topic " + t);
            c.addEventListener("click", () => {
              F.topic = t;
              F.group = "topic";
              F.q = "";
              $("q").value = "";
              closeDetail(false);
              apply();
            });
            tags.appendChild(c);
          });
          d.appendChild(tags);
        }

        d.appendChild(el("p", "sect", f.previewKind === "caption" ? "Preview from caption" : "Preview"));
        d.appendChild(f.preview ? el("div", "pv", f.preview) : el("div", "pv none", "Preview unavailable for this file type."));

        d.appendChild(el("p", "sect", "Path"));
        d.appendChild(el("div", "pth", f.relativePath));
        const abs = el("div", "pth", f.path);
        d.appendChild(abs);

        const acts = el("div", "acts");
        const cp = el("button", "btn primary", "Copy full path");
        cp.type = "button";
        const status = el("p", "status");
        status.setAttribute("role", "status");
        cp.addEventListener("click", () => copyPath(f.path, cp, status, abs));
        acts.appendChild(cp);
        if (OPEN_BASE) {
          // Path-style URL so relative links inside an opened artifact resolve through the same route.
          const href = OPEN_BASE + "/" + f.relativePath.split("/").map(encodeURIComponent).join("/");
          const open = el("a", "btn", "Open");
          open.href = href;
          open.target = "_blank";
          open.rel = "noopener noreferrer";
          const dl2 = el("a", "btn", "Download");
          dl2.href = href + "?download=1";
          acts.append(open, dl2);
        }
        d.append(acts, status);
        h.focus();
        transitionDetail(true, entrance);
        if (GRAPH) GRAPH.select(f.relativePath);
        syncAtlas();
      }
      function closeDetail(restore, pointer = false) {
        if ($("det").hidden) return;
        SEL = null;
        transitionDetail(false, pointer);
        paint();
        if (GRAPH) GRAPH.select(null);
        syncAtlas();
        if (!restore) return;
        if (GRAPH && RETURN_GRAPH) {
          GRAPH.focus(RETURN_GRAPH);
          return;
        }
        const back = RETURN_TO != null && document.querySelector('.row[data-i="' + RETURN_TO + '"]');
        (back || $("q")).focus();
      }
      function copyPath(text, btn, status, node) {
        const ok = () => {
          btn.textContent = "Copied";
          btn.classList.add("done");
          status.textContent = "Full path copied to the clipboard.";
          setTimeout(() => {
            btn.textContent = "Copy full path";
            btn.classList.remove("done");
          }, 1600);
        };
        const fail = () => {
          const range = document.createRange();
          range.selectNodeContents(node);
          const s = getSelection();
          s.removeAllRanges();
          s.addRange(range);
          status.textContent = "The browser blocked copying. The path is selected: press ⌘C or Ctrl+C.";
        };
        // Plain-http origins (e.g. a tailnet IP) have no Clipboard API: fall back
        // to execCommand before asking the user to copy the selected path.
        const legacy = () => {
          const back = document.activeElement;
          const ta = el("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.cssText = "position:fixed;top:0;opacity:0";
          document.body.appendChild(ta);
          ta.select();
          let copied = false;
          try {
            copied = document.execCommand("copy");
          } catch (e) {
            copied = false;
          }
          ta.remove();
          if (back && back.focus) back.focus({ preventScroll: true });
          return copied;
        };
        const fallback = () => (legacy() ? ok() : fail());
        if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, fallback);
        else fallback();
      }

      /* ── Wiring ──────────────────────────────────────────────── */
      function setDensity(n) {
        density = Math.max(0, Math.min(2, n));
        document.documentElement.dataset.density = String(density);
        $("zLabel").textContent = DENSITY[density];
        $("zOut").disabled = density === 0;
        $("zIn").disabled = density === 2;
        $("zReset").disabled = density === 1;
      }
      function wire() {
        setDensity(1);
        $("atlas").addEventListener("atlas-ready", () => {
          const start = openingWait;
          openingWait = null;
          if (start) start();
        });
        document.addEventListener("keydown", () => {
          motionInput = "keyboard";
          stopVisualMotion();
        }, { capture: true });
        document.addEventListener("pointerdown", (e) => {
          motionInput = "pointer";
          stopOpening();
          if (e.target.closest(".graph-stage")) stopVisualMotion();
          releasePress(true);
          const control = e.target.closest(".graph-actions button, #tools button");
          if (control && !control.disabled && !reducedMotion.matches && e.button === 0) {
            pressedControl = control;
            control.classList.add("motion-press");
            control.setAttribute("data-motion-pressed", "");
          }
        }, { capture: true });
        document.addEventListener("pointerup", () => releasePress(), { capture: true });
        document.addEventListener("pointercancel", () => releasePress(true), { capture: true });
        reducedMotion.addEventListener("change", (e) => { if (e.matches) stopVisualMotion(); });
        window.addEventListener("pagehide", stopVisualMotion);
        window.addEventListener("pagehide", () => {
          if (GRAPH) GRAPH.destroy();
          GRAPH = null;
        });
        window.addEventListener("pageshow", (e) => {
          if (e.persisted && IDX && F.view === "graph") render();
        });
        for (const [id, view] of [["vAtlas", "atlas"], ["vGraph", "graph"]]) {
          $(id).addEventListener("click", (e) => {
            motionInput = e.detail > 0 ? "pointer" : "keyboard";
            closeDetail(false);
            F.view = view;
            apply();
          });
        }
        $("q").addEventListener("focus", syncAtlas);
        $("q").addEventListener("blur", syncAtlas);
        let t = null;
        $("q").addEventListener("input", (e) => {
          stopOpening();
          F.q = e.target.value.trim();
          clearTimeout(t);
          syncAtlas();
          t = setTimeout(() => {
            apply();
            $("main").scrollTop = 0;
          }, 60);
        });
        $("q").addEventListener("keydown", (e) => {
          // Overdrive: Enter lands on the top match and opens it.
          if (e.key !== "Enter" || F.view !== "graph" || F.renderer !== "3d" || !VIEW.length) return;
          e.preventDefault();
          const f = VIEW[0];
          if (GRAPH) GRAPH.select(f.relativePath);
          openDetail(f, null, true);
        });
        $("clear").addEventListener("click", () => {
          F.q = "";
          $("q").value = "";
          apply();
          $("q").focus();
        });
        $("gTopic").addEventListener("click", () => {
          F.group = "topic";
          if (F.folder && F.folder !== ROOT && !F.topic) F.folder = F.folder.split("/")[0];
          apply();
        });
        $("gFolder").addEventListener("click", () => {
          F.group = "folder";
          apply();
        });
        $("fType").addEventListener("change", (e) => {
          F.type = e.target.value;
          apply();
        });
        $("fFolder").addEventListener("change", (e) => {
          F.folder = e.target.value;
          apply();
        });
        $("fDate").addEventListener("change", (e) => {
          F.date = e.target.value;
          apply();
        });
        $("zOut").addEventListener("click", () => setDensity(density - 1));
        $("zIn").addEventListener("click", () => setDensity(density + 1));
        $("zReset").addEventListener("click", () => setDensity(1));
        $("filtersToggle").addEventListener("click", (e) => {
          const open = $("tools").classList.toggle("open");
          e.currentTarget.setAttribute("aria-expanded", String(open));
        });
        $("reset").addEventListener("click", () => {
          Object.assign(F, { q: "", topic: "", folder: "", type: "", date: "all" });
          $("q").value = "";
          closeDetail(false);
          apply();
          $("main").scrollTop = 0;
        });
        $("main").addEventListener("scroll", () => { stopOpening(); paint(); }, { passive: true });
        window.addEventListener("resize", () => { stopOpening(); paint(); });
        document.addEventListener("visibilitychange", () => { if (document.hidden) stopOpening(); });

        document.addEventListener("keydown", (e) => {
          const typing = e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement;
          if (e.key === "/" && !typing) {
            e.preventDefault();
            $("q").focus();
            $("q").select();
            return;
          }
          if (e.key === "Escape") {
            if (!$("det").hidden) closeDetail(true);
            else if (F.q) {
              F.q = "";
              $("q").value = "";
              apply();
            } else if (F.group === "topic" && F.topic) {
              F.topic = "";
              apply();
            } else if (F.group === "folder" && F.folder) {
              setFolder(F.folder === ROOT || !F.folder.includes("/") ? "" : F.folder.slice(0, F.folder.lastIndexOf("/")));
            }
            return;
          }
          if ((e.key === "ArrowDown" || e.key === "ArrowUp") && $("vp") && LIST.length) {
            const onRow = e.target.classList && e.target.classList.contains("row");
            if (!onRow && e.target !== $("q")) return;
            e.preventDefault();
            const cur = onRow ? Number(e.target.dataset.i) : -1;
            const nx = e.key === "ArrowDown" ? Math.min(LIST.length - 1, cur + 1) : Math.max(0, cur - 1);
            const main = $("main");
            const y = $("vp").offsetTop + nx * ROW;
            if (y < main.scrollTop) main.scrollTop = y;
            else if (y + ROW > main.scrollTop + main.clientHeight) main.scrollTop = y + ROW - main.clientHeight;
            paint();
            const b = document.querySelector('.row[data-i="' + nx + '"]');
            if (b) b.focus();
          }
        });
      }
    </script>
  </body>
</html>

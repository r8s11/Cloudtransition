  - company: Ground Up International
    role: Senior IT Support Specialist
    application_date: 2026-05-05
    status: "rejected"
    salary_range: target $95-115K, floor $70K (lowered 2026-05-24)
    location: New York, NY (onsite)
    priority: high
    interview_prep:
      - interviews/Ground Up/prep.md
      - interviews/Ground Up/jd-senior-it-support-specialist.md
    next_steps:
    next_steps:
      - task: "Confirm recruiter-screen outcome; capture comp/team/timeline; thank-you."
        date:
    interview_questions: |
      What comp range has Ground Up set for the role?
      What's the size and shape of the help desk team I'd be overseeing?
      How does IT split work between New York and Dongguan day-to-day?
      What's driving the hire — backfill, growth, or new scope?
      What would the first 90 days look like — what does the VP want tackled first?
      What does the interview process look like end-to-end, and the timeline?
      Beyond the JD, what does success look like at 6–12 months?
    interview_preparation: |
      60-second pitch: 10+ yrs IT; M365 admin (Entra/Intune/Exchange/SharePoint); ABM + Intune ADE at Peak; built Jira SM from scratch at Ventus; Zendesk/ServiceNow/Jira SM/ConnectWise.
      Story — Jira SM at Ventus: no system of record → request types, SLAs, catalog, reporting.
      Story — ABM + Intune ADE at Peak: zero-touch Mac/iOS, config profiles, compliance, conditional access.
      Story — cross-time-zone handovers with India/Europe at Peak → the Dongguan question.
      PowerShell: honest framing — M365 admin use, deeper via AZ-204; can extend an existing toolkit.
      Power Automate: approvals/notifications, not a primary build tool; would lean in early.
      ZohoDesk: four ITSM platforms; same model, a couple of days to fluent.
      Security: Defender daily; Cortex XDR at Jounce; KnowBe4 not administered but familiar; HIPAA-regulated background.
      Synology / BitWarden: not administered; closest comparable is file-share and enterprise password mgmt (CyberArk).
      Team oversight: senior IC — Jira SM build, OneView Win10 for 200+ workstations, office relocation; formal oversight is the next step.
      Salary: ask their range first. Tracker target $95–115K, floor $70K lowered 2026-05-24; prep.md still says a $95K floor — reconcile before the call.
      Onsite NYC: Bronx-based, already commuting. Why Ground Up: scope (admin + team oversight), Dongguan collaboration, product company, long term.
    notes: |
      Strong JD match: M365 admin (Intune/Entra/Exchange/SharePoint), Mac MDM
      (ABM+Intune ADE done at Peak), ITSM depth. Gaps: PowerShell depth, Power
      Automate, ZohoDesk, Synology, KnowBe4 — frame with closest comparable + appetite.


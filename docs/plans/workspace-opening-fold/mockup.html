<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opening Fold study</title>
    <!--
      Study for docs/plans/workspace-opening-fold. Not the production implementation.
      Real GSAP 3.15.1 + Flip and the real Three.js r180 sheet, with representative data.
      Serve this folder over HTTP to see the 3D sheet:
        python3 -m http.server 8011 --bind 127.0.0.1 --directory docs/plans/workspace-opening-fold
      Opened from disk the module import is blocked and the static fold shows instead.
    -->
    <style>
      :root {
        --vermilion: #b3212e; --vermilion-deep: #8e1a24; --fold-white: #f4ead8;
        --paper: #f8f1e3; --paper-deep: #efe3cd; --paper-hi: #fdf9ef; --gold: #c9a227;
        --ink: #211d18; --ink-mid: #4f483c; --ink-muted: #554d41;
        --border: #d8c9ab; --border-light: #e4dac4; --radius: 10px; --radius-sm: 6px;
        --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body { font-family: var(--sans); font-size: 14px; line-height: 1.5; color: var(--ink); background: var(--paper); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; -webkit-font-smoothing: antialiased; caret-color: var(--vermilion); }
      ::selection { background: rgba(201, 162, 39, .3); }
      :focus-visible { outline: 2px solid var(--vermilion); outline-offset: 2px; border-radius: 4px; }
      button, input { font: inherit; color: inherit; }
      .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
      .top { display: flex; align-items: center; gap: 16px; padding: 8px 16px; background: var(--vermilion); color: var(--fold-white); flex-shrink: 0; }
      .brand h1 { font-size: 16px; font-weight: 650; letter-spacing: -.01em; line-height: 1.2; }
      .brand p { font-size: 12px; color: rgba(244, 234, 216, .9); }
      #q { flex: 1; max-width: 640px; height: 44px; padding: 0 14px; font-size: 15px; color: var(--ink); background: var(--paper-hi); border: 1px solid var(--vermilion-deep); border-radius: var(--radius); }
      #q::placeholder { color: var(--ink-muted); }
      #q:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
      .count { margin-left: auto; font-size: 12px; white-space: nowrap; }
      @media (max-width: 640px) { .top { flex-wrap: wrap; } #q { order: 3; flex-basis: 100%; max-width: none; } .study { margin-left: 0; } }
      .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 16px; background: var(--paper-deep); border-bottom: 1px solid var(--border); flex-shrink: 0; }
      .seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; background: var(--paper-hi); }
      .seg button { min-height: 44px; min-width: 44px; padding: 0 14px; border: 0; background: none; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--ink-mid); }
      .seg button + button { border-left: 1px solid var(--border); }
      .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper-hi); }
      .btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--paper-hi); cursor: pointer; font-size: 13px; font-weight: 500; }
      .study { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--ink-muted); }
      .main { position: relative; flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px 48px; }

      /* Cover: the heading is the display moment; no label sits above it. */
      .ctx { padding: 12px 16px 0; }
      .ctx h2 { font-size: 18px; font-weight: 650; letter-spacing: -.015em; }
      .is-cover .ctx { padding: 20px 16px 28px; }
      .is-cover .ctx h2 { max-width: 13ch; font-size: clamp(38px, 5.6vw, 84px); line-height: 1.04; letter-spacing: -.03em; text-wrap: balance; }
      .ctx h2 .n { color: var(--vermilion); font-variant-numeric: tabular-nums; }
      .w { display: inline-block; overflow: hidden; padding: .14em 0; margin: -.14em 0; vertical-align: bottom; }
      .w > span, .title-name { display: inline-block; }
      .facts { margin-top: 18px; max-width: 60ch; color: var(--ink-mid); }
      .is-cover .ctx { padding-top: 96px; }

      .atlas { display: flex; align-items: center; gap: 16px; padding: 0 16px; }
      .atlas-stage { position: relative; flex-shrink: 0; width: 80px; height: 72px; }
      .atlas-stage svg, .atlas-stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; pointer-events: none; }
      .atlas-rendered .atlas-stage svg { visibility: hidden; }
      .atlas-name { font-weight: 600; }
      .atlas-caption, .atlas-motion { display: none; }
      .is-cover .atlas { position: absolute; top: 16px; left: 16px; padding: 0; }
      .is-cover .atlas-name, .is-list .atlas, .is-graph .atlas { display: none; }
      @media (min-width: 1100px) {
        .is-cover .ctx { min-height: 348px; padding: 0 476px 28px 16px; display: flex; flex-direction: column; justify-content: flex-end; }
        .atlas, .is-cover .atlas { position: absolute; top: 32px; right: 24px; left: auto; display: block; width: 288px; padding: 0; }
        .atlas-stage { width: 288px; height: 292px; margin-bottom: 22px; }
        .is-cover .atlas { top: 8px; right: 32px; width: 420px; }
        .is-cover .atlas-stage { width: 420px; height: 340px; margin-bottom: 0; }
        .is-list .atlas { display: block; }
        .is-list.main { padding-right: 344px; }
        .is-list .atlas-caption { display: block; margin-top: 8px; font-size: 12px; color: var(--ink-mid); }
        .atlas-rendered .atlas-motion { display: inline-flex; margin-top: 14px; }
        .is-cover .atlas-motion { position: absolute; right: 0; bottom: -12px; margin: 0; }
      }

      .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(216px, 100%), 1fr)); gap: 12px; }
      .tile { display: flex; flex-direction: column; gap: 6px; padding: 14px; text-align: left; background: var(--paper-hi); border: 1px solid var(--border-light); border-radius: var(--radius); cursor: pointer; transition: background-color .15s, border-color .15s; }
      .tile:hover { border-color: var(--border); }
      .tile:active { background: var(--paper-deep); }
      .tile-head { display: flex; align-items: baseline; gap: 12px; }
      .tile-name { flex: 1; font-size: 16px; font-weight: 650; letter-spacing: -.015em; line-height: 1.25; }
      .tile-n { font-size: 13px; color: var(--vermilion); font-weight: 600; }
      .tile-meta { font-size: 12px; color: var(--ink-mid); }
      .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; height: 56px; padding: 0 12px 0 34px; border: 0; border-bottom: 1px solid var(--border-light); background: none; text-align: left; cursor: pointer; }
      .row-n { display: block; font-weight: 500; }
      .row-p { display: block; font-family: var(--mono); font-size: 11px; color: var(--ink-muted); }
      .row-r { text-align: right; font-size: 11px; color: var(--ink-muted); line-height: 1.4; }

      .graph { position: relative; height: min(640px, calc(100dvh - 240px)); min-height: 320px; border: 1px solid #415161; border-radius: var(--radius); background: #141e29; color: #f0ede6; overflow: hidden; }
      .graph canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      .graph p { position: absolute; left: 16px; bottom: 12px; font-size: 12px; color: #bac6d2; }
      .hub { position: absolute; width: 12px; height: 12px; margin: -6px; border-radius: 50%; background: var(--c); }
      .hub span { position: absolute; left: 18px; top: -5px; white-space: nowrap; font-size: 12px; font-weight: 600; color: var(--c); }
      #ghosts { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
      .ghost { position: absolute; border: 1px solid var(--border-light); border-radius: var(--radius); background: var(--paper-hi); }
      .fly { position: absolute; font-size: 16px; font-weight: 650; letter-spacing: -.015em; line-height: 1.25; white-space: nowrap; transform-origin: 0 50%; }
      .carry { display: inline-block; }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="brand"><h1>Workspace map</h1><p>Snapshot Nov 12, 2026, 9:01 PM</p></div>
      <input id="q" type="search" aria-label="Search files" placeholder="Search topics, names, folders  ( / )" autocomplete="off" />
      <p class="count num" id="count"></p>
    </header>
    <div class="tools">
      <div class="seg" role="group" aria-label="Map view">
        <button type="button" id="vAtlas">Atlas</button><button type="button" id="vGraph">Graph</button>
      </div>
      <button type="button" class="btn" id="reset">Reset filters</button>
      <div class="study">Study only: 14 sample rows per topic, placeholder graph. <button type="button" class="btn" id="replay">Replay intro</button></div>
    </div>
    <main class="main" id="main">
      <aside class="atlas" id="atlas" aria-label="Folded Atlas">
        <div class="atlas-stage" id="stage" aria-hidden="true">
          <svg viewBox="0 0 300 300">
            <ellipse cx="153" cy="248" rx="82" ry="10" fill="var(--border-light)" />
            <path d="M35 160 141 48 154 176Z" fill="var(--paper-hi)" /><path d="M141 48 262 111 154 176Z" fill="var(--fold-white)" />
            <path d="M35 160 154 176 103 223Z" fill="var(--paper-deep)" /><path d="M154 176 262 111 217 222Z" fill="var(--border)" />
            <path d="M103 223 154 176 217 222 165 197Z" fill="var(--vermilion)" />
            <path d="M35 160 141 48 262 111 217 222 165 197 103 223ZM141 48 154 176 35 160M154 176 262 111M154 176 103 223M154 176 217 222" fill="none" stroke="var(--ink-mid)" stroke-opacity=".28" stroke-width=".8" />
          </svg>
        </div>
        <div>
          <p class="atlas-name" id="atlas-name"></p>
          <p class="atlas-caption">Same workspace. A different angle.</p>
          <button class="btn atlas-motion" id="pause" type="button" aria-pressed="false">Pause motion</button>
        </div>
      </aside>
      <div class="ctx" id="ctx"></div>
      <div id="body"></div>
    </main>
    <div id="ghosts" aria-hidden="true"></div>

    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/Flip.min.js"></script>
    <script>
      "use strict";
      const TOPICS = [
        ["agent", 242, "In agentic-os, second-brain, docs", "Latest today"], ["career", 157, "In resume, interviews, dashboard-app", "Latest yesterday"],
        ["frontend", 105, "In projects, dashboard-app, React", "Latest today"], ["planning", 100, "In docs, plans, resume", "Latest today"],
        ["docs", 99, "In docs, projects, tools", "Latest today"], ["operations", 75, "In IT Mgmt, tools, dashboard-app", "Latest today"],
        ["infrastructure", 61, "In resume, dashboard-app, docs", "Latest today"], ["testing", 60, "In dashboard-app, agentic-os, tools", "Latest today"],
        ["database", 39, "In agentic-os, IT Mgmt, plans", "Latest 3 days ago"], ["assets", 32, "In IT Mgmt, projects, agentic-os", "Latest today"],
        ["api", 25, "In agentic-os, dashboard-app, React", "Latest today"], ["learning", 23, "In plans, workspace root, second-brain", "Latest today"],
        ["config", 15, "In agentic-os, dashboard-app, second-brain", "Latest 3 days ago"], ["finance", 13, "In freelance, docs, dashboard-app", "Latest 3 days ago"],
        ["security", 12, "In tools, docs, workspace root", "Latest 3 days ago"], ["deployment", 5, "In agentic-os, dashboard-app, tools", "Latest today"],
        ["Untagged", 25, "No topic matched the name or path", ""],
      ];
      const ROWS = [
        ["eval.results.json", "docs/plans/visual-second-brain-overdrive", "config"], ["eval.md", "docs/plans/visual-second-brain-overdrive", "document"],
        ["build.md", "docs/plans/visual-second-brain-overdrive", "document"], ["atlas.js", "visual-second-brain/assets", "code"],
        ["README.md", "visual-second-brain", "document"], ["test_refresh_index.py", "visual-second-brain/tests", "code"],
        ["visual-second-brain.brief.md", "docs/briefs", "document"], ["DESIGN.md", "visual-second-brain", "document"],
        ["visual-second-brain.html", "visual-second-brain", "web"], ["mockup.html", "docs/plans/visual-second-brain-overdrive", "web"],
        ["rd.md", "docs/plans/visual-second-brain-overdrive", "document"], ["com.cloudtransition.mission-control.plist", "agentic-os/launchd", "config"],
        ["CLAUDE.md", "dashboard-app", "document"], ["catalogue.md", "second-brain", "document"],
      ];
      const COLORS = ["#76b7f4", "#58cbbb", "#db9be0", "#f2be72", "#b3abff", "#ef9a9a"];
      const TOTAL = 689;
      const $ = (id) => document.getElementById(id);
      const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
      const still = matchMedia("(prefers-reduced-motion: reduce)");
      const G = window.gsap, FlipPlugin = window.Flip;
      if (G && FlipPlugin) G.registerPlugin(FlipPlugin);
      const S = { view: "atlas", topic: "" };
      let pointer = false, running = [], sheet = null, intro = null;
      const canMove = () => Boolean(G && FlipPlugin && !still.matches);

      /* Latest state wins: finish and drop every running timeline, ghost and inline style. */
      function settle() {
        running.forEach((t) => t.progress(1).kill());
        running = [];
        intro = null;
        $("ghosts").replaceChildren();
      }
      const track = (t) => (running.push(t), t);

      function statement(h2) {
        const text = TOTAL + " files, folded into " + TOPICS.length + " topics.";
        h2.setAttribute("aria-label", text);
        text.split(" ").forEach((word, i) => {
          const wrap = el("span", "w"), inner = el("span", /^\d/.test(word) ? "n" : "", word);
          wrap.setAttribute("aria-hidden", "true");
          wrap.appendChild(inner);
          if (i) h2.append(" ");
          h2.appendChild(wrap);
        });
      }

      function render() {
        const main = $("main"), ctx = $("ctx"), body = $("body");
        const cover = S.view === "atlas" && !S.topic, list = S.view === "atlas" && S.topic;
        main.classList.toggle("is-cover", cover);
        main.classList.toggle("is-list", Boolean(list));
        main.classList.toggle("is-graph", S.view === "graph");
        $("vAtlas").setAttribute("aria-pressed", String(S.view === "atlas"));
        $("vGraph").setAttribute("aria-pressed", String(S.view === "graph"));
        $("count").textContent = (list ? TOPICS.find((t) => t[0] === S.topic)[1] : TOTAL) + " of " + TOTAL + " files";
        $("atlas-name").textContent = S.topic || "All topics";
        ctx.replaceChildren();
        body.replaceChildren();
        const h2 = el("h2");
        ctx.appendChild(h2);
        if (cover) {
          statement(h2);
          ctx.appendChild(el("p", "facts", "Largest: agent, career, frontend. Latest change today."));
          const grid = el("div", "tiles");
          TOPICS.forEach(([name, n, where, when]) => {
            const b = el("button", "tile"), head = el("span", "tile-head"), label = el("span", "tile-name"), carry = el("span", "carry", name);
            b.type = "button";
            b.dataset.key = name;
            // The travelling box hugs the word, so the carry never stretches it.
            carry.dataset.flipId = "name-" + name;
            label.appendChild(carry);
            head.append(label, el("span", "tile-n num", String(n)));
            b.append(head, el("span", "tile-meta", where));
            if (when) b.appendChild(el("span", "tile-meta", when));
            b.addEventListener("click", () => go({ topic: name }));
            grid.appendChild(b);
          });
          body.appendChild(grid);
        } else if (list) {
          const name = el("span", "title-name", S.topic);
          name.dataset.flipId = "name-" + S.topic;
          h2.append("Topic: ", name);
          ROWS.forEach(([file, path, type]) => {
            const row = el("button", "row"), mid = el("span"), right = el("span", "row-r");
            row.type = "button";
            mid.append(el("span", "row-n", file), el("span", "row-p", path));
            right.append(type, el("br"), el("span", "num", "Nov 12, 2026"));
            row.append(mid, right);
            body.appendChild(row);
          });
        } else {
          h2.textContent = "Topics";
          body.appendChild(graph());
        }
        if (sheet) sheet.pose(S.topic);
      }

      function graph() {
        const panel = el("section", "graph"), canvas = el("canvas");
        panel.append(canvas, el("p", "", "Placeholder for the existing 3D Depth Constellation."));
        requestAnimationFrame(() => {
          const w = panel.clientWidth, h = panel.clientHeight, dpr = Math.min(devicePixelRatio || 1, 2);
          canvas.width = w * dpr; canvas.height = h * dpr;
          const c = canvas.getContext("2d");
          c.scale(dpr, dpr);
          let seed = 7;
          const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
          panel.querySelectorAll(".hub").forEach((hub, i) => {
            const x = parseFloat(hub.style.left) / 100 * w, y = parseFloat(hub.style.top) / 100 * h, spread = 14 + Math.sqrt(TOPICS[i][1]) * 5.5;
            c.fillStyle = COLORS[i % 6]; c.strokeStyle = COLORS[i % 6]; c.globalAlpha = .16; c.lineWidth = .5;
            for (let k = 0; k < TOPICS[i][1]; k++) {
              const a = rnd() * 6.283, r = Math.sqrt(rnd()) * spread, px = x + Math.cos(a) * r * 1.25, py = y + Math.sin(a) * r;
              c.beginPath(); c.moveTo(x, y); c.lineTo(px, py); c.stroke();
              c.globalAlpha = .85; c.beginPath(); c.arc(px, py, 1.5, 0, 6.283); c.fill(); c.globalAlpha = .16;
            }
          });
        });
        TOPICS.forEach(([name, n], i) => {
          const a = i * 2.39996, r = 9 + Math.sqrt(i) * 9.5, hub = el("div", "hub");
          hub.style.setProperty("--c", COLORS[i % 6]);
          hub.style.left = 50 + Math.cos(a) * r * .95 + "%";
          hub.style.top = 48 + Math.sin(a) * r + "%";
          hub.dataset.key = name;
          hub.appendChild(el("span", "", name + " · " + n));
          panel.appendChild(hub);
        });
        return panel;
      }

      function go(next) {
        const from = { ...S }, to = { ...S, ...next };
        settle();
        const move = pointer && canMove();
        const stage = $("stage");
        let stageState, nameState, tileRects;
        if (move) {
          stageState = FlipPlugin.getState(stage);
          const carried = from.view === "atlas" && to.view === "atlas" && (from.topic || to.topic);
          const source = carried && document.querySelector('[data-flip-id="name-' + (to.topic || from.topic) + '"]');
          if (source) nameState = FlipPlugin.getState(source);
          if (from.view === "atlas" && !from.topic && to.view === "graph") {
            tileRects = [...document.querySelectorAll(".tile")].map((t) => ({ key: t.dataset.key, rect: t.getBoundingClientRect(), name: t.querySelector(".carry").getBoundingClientRect() }));
          }
        }
        Object.assign(S, to);
        render();
        $("main").scrollTop = 0;
        if (!move) return;
        const ease = "expo.out";
        if (from.view === "atlas" && to.view === "atlas") track(FlipPlugin.from(stageState, { targets: stage, duration: .6, ease, scale: true }));
        const name = nameState && document.querySelector('[data-flip-id="name-' + (to.topic || from.topic) + '"]');
        if (name) track(FlipPlugin.from(nameState, { targets: name, duration: .55, ease, scale: true }));
        if (to.view === "atlas" && to.topic) {
          track(G.from(".row", { opacity: 0, y: 12, duration: .4, stagger: .018, ease, clearProps: "opacity,transform" }));
        } else if (to.view === "atlas") {
          const rest = [...document.querySelectorAll(".tile")].filter((t) => t.dataset.key !== from.topic);
          track(G.from(rest, { opacity: 0, y: 10, duration: .35, stagger: .012, ease, clearProps: "opacity,transform" }));
          track(G.from("#ctx h2, .facts", { opacity: 0, duration: .3, clearProps: "opacity" }));
        } else if (tileRects) gather(tileRects);
        else track(G.from(".graph", { opacity: .85, duration: .22, ease, clearProps: "opacity" }));
      }

      /* Names are what travel: each tile's name lands on the hub with the same key; the card dissolves in place. */
      function gather(tileRects) {
        const layer = $("ghosts"), tl = track(G.timeline({ onComplete: () => layer.replaceChildren() }));
        tl.from(".graph", { opacity: 0, duration: .3, ease: "power2.out", clearProps: "opacity" }, 0);
        tileRects.forEach(({ key, rect, name }, i) => {
          const hub = document.querySelector('.hub[data-key="' + key + '"]');
          if (!hub) return;
          const label = hub.querySelector("span"), end = label.getBoundingClientRect(), ghost = el("div", "ghost"), fly = el("div", "fly", key);
          Object.assign(ghost.style, { left: rect.left + "px", top: rect.top + "px", width: rect.width + "px", height: rect.height + "px" });
          Object.assign(fly.style, { left: name.left + "px", top: name.top + "px" });
          layer.append(ghost, fly);
          const at = i * .016;
          tl.to(ghost, { opacity: 0, scale: .97, duration: .22, ease: "power2.out" }, at);
          // Colour settles first so the name stays legible over the dark field.
          tl.to(fly, { color: COLORS[i % 6], duration: .14, ease: "power1.out" }, at);
          tl.to(fly, { x: end.left - name.left, y: end.top + end.height / 2 - (name.top + name.height / 2), scale: .75, duration: .62, ease: "expo.inOut" }, at);
          tl.from(label, { opacity: 0, duration: .12, clearProps: "opacity" }, at + .56);
          tl.to(fly, { opacity: 0, duration: .1 }, at + .58);
        });
        // After measuring: a from-tween renders scale 0 immediately.
        tl.from(".hub", { scale: 0, duration: .45, stagger: .014, ease: "expo.out", clearProps: "transform" }, .25);
      }

      /* The sheet loads lazily; the fold starts when it exists and ends with the intro's own interruption. */
      function playFold() {
        if (!sheet) return;
        const fold = { p: 0 };
        sheet.fold(0);
        track(G.to(fold, { p: 1, duration: 1.15, ease: "expo.inOut", onUpdate: () => sheet.fold(fold.p) }));
      }
      function playIntro() {
        settle();
        if (!canMove() || S.view !== "atlas" || S.topic) { if (sheet) sheet.fold(1); return; }
        intro = track(G.timeline({ defaults: { ease: "expo.out" } }));
        intro.from(".w > span", { yPercent: 105, duration: .8, stagger: .05 }, 0)
          .from(".facts", { opacity: 0, y: 8, duration: .5, clearProps: "opacity,transform" }, .3)
          .from(".tile", { opacity: 0, y: 16, duration: .5, stagger: .028, clearProps: "opacity,transform" }, .22);
        playFold();
      }

      /* The approved sculpture: same vertices, faces, materials, camera and lights as assets/atlas.js. */
      const V = [[-1.3, .05, .05], [-.12, 1.35, -.18], [1.25, .45, .06], [.8, -.9, -.12], [.04, -.25, .72], [-.78, -.88, -.02], [.02, -.65, -.12]];
      const FACES = [[0, 1, 4], [1, 2, 4], [2, 3, 4], [0, 4, 5], [5, 4, 6], [4, 3, 6]];
      function foldPositions(p, out = new Float32Array(54)) {
        const open = 1 + (1 - p) * .1;
        FACES.forEach((face, i) => face.forEach((v, j) => out.set([V[v][0] * open, V[v][1] * open, V[v][2] * p], i * 9 + j * 3)));
        return out;
      }
      async function createSheet(stage) {
        const THREE = await import("./vendor/three.module.min.js");
        const canvas = el("canvas");
        stage.appendChild(canvas);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: "low-power" });
        renderer.setClearColor(0, 0);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.5;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(35, 1, .1, 30);
        camera.position.set(0, .55, 5.5);
        camera.lookAt(0, .1, 0);
        const geometry = new THREE.BufferGeometry(), attribute = new THREE.BufferAttribute(foldPositions(introActive() ? 0 : 1), 3);
        geometry.setAttribute("position", attribute);
        geometry.computeVertexNormals();
        FACES.forEach((_, i) => geometry.addGroup(i * 3, 3, i >= 4 ? 3 : i % 3));
        const paper = new THREE.Mesh(geometry, [0xfdf9ef, 0xf4ead8, 0xefe3cd, 0xb3212e].map((color) => new THREE.MeshStandardMaterial({ color, roughness: .88, metalness: 0, flatShading: true, side: THREE.DoubleSide })));
        paper.castShadow = paper.receiveShadow = true;
        scene.add(paper, new THREE.HemisphereLight(0xfff9ed, 0x82735e, 3));
        const key = new THREE.DirectionalLight(0xfff5df, 3.8);
        key.position.set(-3.2, 5, 4);
        key.castShadow = true;
        key.shadow.mapSize.set(512, 512);
        key.shadow.camera.left = key.shadow.camera.bottom = -3;
        key.shadow.camera.right = key.shadow.camera.top = 3;
        key.shadow.normalBias = .025;
        scene.add(key);
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.ShadowMaterial({ opacity: .07 }));
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -1.3;
        floor.receiveShadow = true;
        scene.add(floor);
        let progress = introActive() ? 0 : 1, targetY = -.32, poseY = targetY, paused = false, time = 0, last = 0;
        function size() {
          const w = stage.clientWidth, h = stage.clientHeight;
          if (!w || !h) return;
          renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
          renderer.setSize(w, h, false);
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
        }
        new ResizeObserver(size).observe(stage);
        size();
        (function frame(now) {
          requestAnimationFrame(frame);
          if (document.hidden || !stage.clientWidth) return;
          const dt = last ? Math.min((now - last) / 1000, .04) : 0;
          last = now;
          poseY += (targetY - poseY) * Math.min(1, dt * 14);
          if (!paused && !still.matches && progress === 1) time += dt;
          const open = 1 - progress;
          paper.rotation.set(-.14 - open * .95 + Math.sin(time * .31) * .025, poseY + open * .7 + Math.sin(time * .38) * .055, -.07);
          paper.position.y = Math.sin(time * .65) * .045 - open * .35;
          renderer.render(scene, camera);
        })(0);
        $("atlas").classList.add("atlas-rendered");
        $("pause").addEventListener("click", (e) => {
          paused = !paused;
          e.currentTarget.textContent = paused ? "Resume motion" : "Pause motion";
          e.currentTarget.setAttribute("aria-pressed", String(paused));
        });
        return {
          fold(p) { progress = p; foldPositions(p, attribute.array); attribute.needsUpdate = true; },
          pose(topic) {
            let seed = 0;
            for (let i = 0; i < topic.length; i++) seed = (seed * 31 + topic.charCodeAt(i)) | 0;
            targetY = topic ? -.32 + ((seed >>> 0) % 7 - 3) * .12 : -.32;
          },
        };
      }

      const introActive = () => Boolean(intro && intro.progress() < 1);
      addEventListener("pointerdown", () => { pointer = true; if (intro) settle(); }, true);
      addEventListener("keydown", (e) => {
        pointer = false;
        if (intro) settle();
        if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
      }, true);
      $("q").addEventListener("input", () => intro && settle());
      $("vAtlas").addEventListener("click", () => go({ view: "atlas" }));
      $("vGraph").addEventListener("click", () => go({ view: "graph" }));
      $("reset").addEventListener("click", () => go({ view: "atlas", topic: "" }));
      $("replay").addEventListener("click", () => { settle(); Object.assign(S, { view: "atlas", topic: "" }); render(); playIntro(); });
      render();
      const wide = matchMedia("(min-width: 1100px)");
      (wide.matches ? createSheet($("stage")) : Promise.reject()).then((made) => {
        sheet = made;
        if (introActive()) playFold();
      }).catch(() => {});
      playIntro();
    </script>
  </body>
</html>

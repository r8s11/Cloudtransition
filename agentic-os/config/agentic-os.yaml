database:
  provider: sqlite
  path: .agentic-os/os.db

policy:
  default: require_approval

  capabilities:
    filesystem.read:
      decision: allow

    filesystem.write:
      decision: allow

    filesystem.delete:
      decision: require_approval

    web.search:
      decision: allow

    email.send:
      decision: require_approval

    git.commit:
      decision: require_approval

    deployment.production:
      decision: require_approval

    database.destructive:
      decision: deny

hub:
  budget: 10
  maxDepth: 3
  freeModels: opencode/beam-free
  agents:
    specialized-chief-of-staff:
      name: Chief of Staff
      coordinator: null
      memoryDir: workspace/agents/chief-of-staff/memory
      outputDirs: workspace/agents/chief-of-staff/outputs
      costClass: free
      installed: true
    forge:
      name: Forge
      coordinator: specialized-chief-of-staff
      memoryDir: workspace/agents/forge/memory
      outputDirs: workspace/agents/forge/outputs
      costClass: free
      installed: true
    scout:
      name: Scout
      coordinator: forge
      memoryDir: workspace/agents/scout/memory
      outputDirs: workspace/agents/scout/outputs
      costClass: free
      installed: true
    job-reader:

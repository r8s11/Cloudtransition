    cv-adapter:
      name: CV Adapter
      coordinator: forge
      memoryDir: workspace/agents/cv-adapter/memory
      outputDirs: workspace/agents/cv-adapter/outputs
      costClass: free
      installed: true
    personal-growth-mentor:
      name: Personal Growth Mentor
      coordinator: specialized-chief-of-staff
      memoryDir: workspace/agents/personal-growth-mentor/memory
      outputDirs: workspace/agents/personal-growth-mentor/outputs
      costClass: free
      installed: true
    resume-tailor:
      name: Resume Tailor
      coordinator: specialized-chief-of-staff

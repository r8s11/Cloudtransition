<!doctype html><meta name="autofill-test-ats" content="workday"><main></main><script>
let step=0;document.body.dataset.nextClicks='0';document.body.dataset.submitClicks='0';
function render(){document.querySelector('main').innerHTML=[
'<h1>My Information</h1><input data-automation-id="legalNameSection_firstName" aria-label="First name"><input data-automation-id="legalNameSection_lastName" aria-label="Last name"><button data-automation-id="selectWidget" role="combobox" aria-label="Country" aria-controls="countries" aria-expanded="false">Select</button><button data-automation-id="bottom-navigation-next-button">Next</button>',
'<h1>My Experience</h1><div data-automation-id="file-upload-drop-zone" aria-label="Resume" style="padding:30px;border:1px solid">Drop resume here</div><button data-automation-id="bottom-navigation-next-button">Next</button>',
'<h1>Voluntary Disclosures</h1><label>Gender<select data-automation-id="gender"><option value="">Select</option><option>Male</option><option>Female</option></select></label><button id="submit">Submit application</button>'
][step];const next=document.querySelector('[data-automation-id=bottom-navigation-next-button]');if(next)next.onclick=()=>{document.body.dataset.nextClicks=String(+document.body.dataset.nextClicks+1);step++;render()};const combo=document.querySelector('[role=combobox]');if(combo)combo.onclick=()=>{combo.setAttribute('aria-expanded','true');const list=document.createElement('div');list.id='countries';for(const v of ['Canada','United States']){const o=document.createElement('div');o.setAttribute('data-automation-id','promptOption');o.textContent=v;o.onclick=()=>{combo.textContent=v;combo.setAttribute('aria-expanded','false');list.remove()};list.append(o)}document.body.append(list)};const drop=document.querySelector('[data-automation-id=file-upload-drop-zone]');if(drop){drop.ondragover=e=>e.preventDefault();drop.ondrop=e=>{e.preventDefault();if(e.dataTransfer.files.length)drop.textContent=e.dataTransfer.files[0].name}}const submit=document.querySelector('#submit');if(submit)submit.onclick=()=>document.body.dataset.submitClicks=String(+document.body.dataset.submitClicks+1)}render();
</script>

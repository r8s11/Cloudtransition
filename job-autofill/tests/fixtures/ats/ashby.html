<!doctype html><meta name="autofill-test-ats" content="ashby"><h1>Apply</h1><label>Name<input name="_systemfield_name"></label><label>Email<input name="_systemfield_email"></label><div id="shadow"></div><button role="combobox" aria-label="Country" aria-expanded="false" aria-controls="country-options">Select</button><fieldset><legend>Do you need sponsorship?</legend><label><input type="radio" name="sponsor" value="Yes">Yes</label><label><input type="radio" name="sponsor" value="No">No</label></fieldset><script>
shadow.attachShadow({mode:'open'}).innerHTML='<label>Phone<input type="tel"></label>';
const combo=document.querySelector('[role=combobox]'); let down=false;
combo.addEventListener('pointerdown',()=>down=true); combo.addEventListener('click',()=>{if(!down)return;down=false;combo.setAttribute('aria-expanded','true');const list=document.createElement('div');list.id='country-options';list.setAttribute('role','listbox');for(const value of ['Canada','United States']){const option=document.createElement('div');option.setAttribute('role','option');option.textContent=value;option.onclick=()=>{combo.textContent=value;combo.setAttribute('aria-expanded','false');list.remove()};list.append(option)}document.body.append(list)});
</script>

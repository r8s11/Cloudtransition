<!doctype html><html lang="en"><title>Large form</title><body><form id="form"></form><script>const f=document.querySelector('form');for(let i=0;i<120;i++)f.insertAdjacentHTML('beforeend','<label>First Name<input></label>');for(let i=0;i<40;i++)f.insertAdjacentHTML('beforeend','<label>Country<select><option value="">Please select</option><option>United States</option></select></label>');for(let i=0;i<20;i++)f.insertAdjacentHTML('beforeend','<fieldset><legend>Are you legally authorized to work in the US?</legend><label><input type="radio" name="r'+i+'" value="Yes">Yes</label><label><input type="radio" name="r'+i+'" value="No">No</label></fieldset>');for(let i=0;i<20;i++)f.insertAdjacentHTML('beforeend','<label>Country<button type="button" role="combobox" aria-expanded="false" aria-controls="list'+i+'">Please select</button></label><div id="list'+i+'" role="listbox" hidden><div role="option">United States</div></div>');document.querySelectorAll('[role=combobox]').forEach(b=>{const l=document.getElementById(b.getAttribute('aria-controls'));b.onclick=()=>{l.hidden=!l.hidden;b.setAttribute('aria-expanded',String(!l.hidden))};l.onclick=()=>{b.textContent='United States';l.hidden=true;b.setAttribute('aria-expanded','false')}});window.longTasks=[];new PerformanceObserver(l=>longTasks.push(...l.getEntries().map(e=>e.duration))).observe({type:'longtask',buffered:true});</script></body></html>

# Career Goals
# Long-term vision broken down into actionable milestones

vision:
  title: DevOps Engineer (Full-Stack Cloud)
  timeframe: 3 years # Target: 2029
  description: |
    Transition into a DevOps / Cloud Engineer role with deep expertise in
    CI/CD pipelines, Infrastructure as Code, container orchestration (Kubernetes),
    and Azure cloud services. Leverage existing AWS experience (Cloud Practitioner)
    and IT Support background to stand out as a well-rounded engineer who can bridge
    development, operations, and infrastructure support. Differentiate with cloud
    security (AZ-500) and AI/ML foundations (AI-102) — the two fastest-growing
    skill demands in the NYC market.

long_term_goals:
  - id: LT-01
    goal: Secure a DevOps Engineer role
    target_date: 2028-06
    status: in_progress
    success_criteria:
      - Employed as DevOps / Cloud Engineer or related title
      - Salary meets or exceeds target range
      - Working with Kubernetes, Terraform, and CI/CD daily
    dependencies:
      - LT-02 # Azure certification
      - LT-03 # Portfolio projects

  - id: LT-02
    goal: Earn Azure DevOps Engineer Expert certification (AZ-400)
    target_date: 2027-06
    status: not_started
    success_criteria:
      - Pass AZ-204 (Developer Associate) as prerequisite
      - Pass AZ-400 exam
      - Update LinkedIn and resume with credential
    dependencies:
      - ST-03 # AZ-204 prep

  - id: LT-03
    goal: Build a production-quality portfolio with 3+ deployed cloud projects
    target_date: 2027-01
    status: in_progress
    success_criteria:
      - 3 projects live with public GitHub repos (20+ commits each)
      - Each project uses CI/CD, IaC, and Azure deployment
      - Portfolio site live and linked on resume/LinkedIn
    dependencies:
      - ST-01 # Task Manager MVP
      - ST-02 # Docker & CI/CD skills

  - id: LT-04
    goal: Reach advanced proficiency in Python and JavaScript
    target_date: 2027-12
    status: in_progress
    success_criteria:
      - Comfortable building REST APIs with FastAPI (Python)
      - Comfortable with React functional components and hooks
      - At least one full-stack project deployed per language
    dependencies: []

  - id: LT-05
    goal: Earn Azure Security Engineer Associate certification (AZ-500)
    target_date: 2027-03
    status: not_started
    success_criteria:
      - Complete Microsoft Learn AZ-500 learning path
      - Pass AZ-500 exam
      - Demonstrate cloud security skills in at least one portfolio project
    dependencies:
      - ST-03  # AZ-204 builds Azure fluency first

  - id: LT-06
    goal: Build AI/ML foundational skills and earn AI-102 certification
    target_date: 2027-06
    status: not_started
    success_criteria:
      - Complete AI-900 (Azure AI Fundamentals) as stepping stone
      - Pass AI-102 (Azure AI Engineer Associate)
      - Integrate an AI feature into one portfolio project
    dependencies:
      - ST-03  # AZ-204 prerequisite Azure knowledge

